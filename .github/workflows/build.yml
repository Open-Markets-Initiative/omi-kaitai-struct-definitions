name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Kaitai Struct Compiler
        run: curl -sSL --fail --retry 5 --retry-delay 5 --retry-all-errors https://github.com/kaitai-io/kaitai_struct_compiler/releases/download/0.11/kaitai-struct-compiler-0.11.zip -o "$RUNNER_TEMP/ksc.zip" && unzip -q "$RUNNER_TEMP/ksc.zip" -d "$RUNNER_TEMP"

      - name: Compile Definitions
        run: find . -name '*.ksy' | xargs "$RUNNER_TEMP/kaitai-struct-compiler-0.11/bin/kaitai-struct-compiler" -t python -t csharp -t java -t cpp_stl -t rust --cpp-standard 11 --outdir generated

      - name: Compile Python Parsers
        run: python3 -m compileall -q generated/python

      - name: Build CSharp Parsers
        run: dotnet new classlib -n Omi.Kaitai.Parsers -o parsers && rm parsers/Class1.cs && dotnet add parsers package KaitaiStruct.Runtime.CSharp && cp generated/csharp/*.cs parsers/ && dotnet build parsers

      - name: Build Java Parsers
        run: curl -sSL --fail --retry 5 --retry-delay 5 --retry-all-errors https://repo1.maven.org/maven2/io/kaitai/kaitai-struct-runtime/0.11/kaitai-struct-runtime-0.11.jar -o "$RUNNER_TEMP/kaitai-runtime.jar" && find generated/java -name '*.java' | xargs javac -cp "$RUNNER_TEMP/kaitai-runtime.jar" -d "$RUNNER_TEMP/java-out"

      - name: Build C++ Parsers
        run: git clone --depth=1 https://github.com/kaitai-io/kaitai_struct_cpp_stl_runtime.git "$RUNNER_TEMP/kaitai-cpp" && find generated/cpp_stl -name '*.cpp' | xargs g++ -std=c++11 -fsyntax-only -I "$RUNNER_TEMP/kaitai-cpp" -I generated/cpp_stl

      - name: Install Python Test Dependencies
        run: pip3 install kaitaistruct dpkt

      - name: Clone Omi Data
        run: git clone --depth=1 https://github.com/Open-Markets-Initiative/omi-data-packets.git

      - name: Run Asx AsxDerivatives Ntp Itch v1.05 Definition Tests
